<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Sky Quest Holidays</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #0f172a;
      --border-color: rgba(56, 189, 248, 0.2);
      --primary-sky: #0284c7;
      --primary-cyan: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(2, 132, 199, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.15) 0%, transparent 40%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 50px 32px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin-bottom: 28px;
    }

    .brand-logo img {
      height: 70px;
      width: auto;
    }

    .brand-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .sky-part { color: var(--primary-cyan); }
    .quest-part { color: var(--text-white); }
    .brand-sub { display: block; font-size: 0.55rem; color: var(--primary-cyan); letter-spacing: 2px; }

    .error-code {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-sky) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .error-heading {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-sky) 100%);
      color: #0f172a;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.5);
    }

    .btn-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      color: var(--primary-cyan);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 12px 24px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn-contact:hover {
      background: rgba(56, 189, 248, 0.1);
    }
  </style>
</head>

<body>

  <div class="error-card">
    <a href="/" class="brand-logo">
      <img src="images/logo.png" alt="Sky Quest Holidays Logo" />
      <div>
        <div class="brand-title">
          <span class="sky-part">SKY</span><span class="quest-part">QUEST</span>
        </div>
        <span class="brand-sub">— HOLIDAYS —</span>
      </div>
    </a>

    <div class="error-code">404</div>
    <h1 class="error-heading">Oops! Page Not Found</h1>
    <p class="error-desc">The destination or page you are looking for doesn't exist, has been renamed, or is temporarily unavailable.</p>

    <div class="actions-row">
      <a href="/" class="btn-home">
        🏡 Back to Sky Quest Home
      </a>
      <a href="https://wa.me/917338710611?text=Hi%20Sky%20Quest%20Holidays!%20I%20came%20across%20a%20missing%20page%20on%20your%20website." target="_blank" rel="noopener noreferrer" class="btn-contact">
        💬 Contact Support on WhatsApp
      </a>
    </div>
  </div>

</body>

</html>
