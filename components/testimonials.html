<!-- Customer Reviews & Testimonials -->
<section class="testimonials-section" id="testimonials">
  <div class="container">
    <div class="section-title-wrapper">
      <span class="section-subtitle">Client Feedback</span>
      <h2 class="section-title">Traveller Stories 🌍</h2>
      <p class="section-description">Real reviews from families, couples, and college student groups.</p>
    </div>

    <!-- Video Stories Section -->
    <div class="video-stories-wrapper" id="videoStoriesContainer">
      <h3 class="video-stories-title">🎥 Customer Video Feedback & Trip Stories</h3>
      <div class="video-stories-grid" id="videoStoriesGrid">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <div class="testimonials-grid" id="testimonialsGrid">
      <!-- Rendered dynamically -->
    </div>

    <!-- Submit Feedback Option -->
    <div class="feedback-cta-card">
      <div class="feedback-cta-header">
        <div>
          <h3>Traveled with Sky Quest Holidays? 🌟</h3>
          <p>Share your experience and help future travelers plan their dream trips!</p>
        </div>
        <button class="btn btn-outline btn-feedback-toggle" onclick="toggleFeedbackForm()">✍️ Write a Review</button>
      </div>

      <div class="feedback-form-wrapper" id="feedbackFormWrapper">
        <form id="reviewForm" onsubmit="handleReviewSubmit(event)">
          <div class="form-grid">
            <div class="form-group">
              <label for="reviewName">Your Name *</label>
              <input type="text" id="reviewName" placeholder="Enter your name" required />
            </div>

            <div class="form-group">
              <label for="reviewLocation">Trip Destination / Group Name *</label>
              <input type="text" id="reviewLocation" placeholder="e.g. Munnar Trip / College IV" required />
            </div>

            <div class="form-group">
              <label for="reviewRating">Rating ⭐</label>
              <select id="reviewRating" required>
                <option value="5">⭐⭐⭐⭐⭐ (5/5 Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (4/5 Very Good)</option>
                <option value="3">⭐⭐⭐ (3/5 Good)</option>
              </select>
            </div>

            <div class="form-group full">
              <label for="reviewComment">Your Feedback / Experience *</label>
              <textarea id="reviewComment" rows="3" placeholder="Tell us how your trip was, hotel stay, guide, transport..." required></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-primary mt-4">
            🚀 Submit Feedback
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
