<!-- Package Detail Modal -->
<div class="modal-overlay" id="packageModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('packageModal')">✕</button>
    <div id="packageModalBody">
      <!-- Rendered dynamically -->
    </div>
  </div>
</div>

<!-- Secret Admin Panel Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-box modal-box-admin">
    <button class="modal-close" onclick="closeModal('adminModal')">✕</button>
    <div class="modal-body" id="adminModalBody">
      <!-- Admin Login or Dashboard rendered dynamically by JavaScript -->
    </div>
  </div>
</div>

<!-- Custom Image Lightbox Modal -->
<div class="lightbox-modal" id="lightboxModal">
  <div class="lightbox-content">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav lightbox-prev" onclick="prevLightboxImage()" aria-label="Previous image">&#10094;</button>
    <img id="lightboxImg" src="" alt="Gallery Preview" />
    <button class="lightbox-nav lightbox-next" onclick="nextLightboxImage()" aria-label="Next image">&#10095;</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<!-- Confirmation Toast / Popup Modal -->
<div class="toast-modal" id="toastModal">
  <div class="toast-card">
    <div class="toast-icon">✅</div>
    <h3 id="toastTitle">Enquiry Submitted!</h3>
    <p id="toastMessage">Thank you! Connecting you directly to our WhatsApp travel specialist...</p>
    <button class="btn btn-primary" onclick="closeToast()">OK</button>
  </div>
</div>
